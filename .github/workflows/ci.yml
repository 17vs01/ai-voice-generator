name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile sources (syntax check)
        run: |
          python -m py_compile app.py tts_service.py
          echo "✅ Python syntax OK"

      - name: Check requirements.txt is readable
        run: |
          test -s requirements.txt && echo "✅ requirements.txt present"
